<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E7D32" />
      <stop offset="50%" stop-color="#4CAF50" />
      <stop offset="100%" stop-color="#81C784" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B5E20" />
      <stop offset="70%" stop-color="#43A047" />
      <stop offset="100%" stop-color="#A5D6A7" />
    </linearGradient>
    <linearGradient id="holoOverlay" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#64B5F6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Aura -->
  <circle cx="50" cy="50" r="42" fill="#E8F5E9" opacity="0.6" />

  <!-- Shield Base Shape -->
  <path d="M 50 12 C 68 12 82 20 82 34 C 82 62 50 88 50 88 C 50 88 18 62 18 34 C 18 20 32 12 50 12 Z" 
        fill="url(#shieldGrad)" filter="url(#glow)" />

  <!-- Holographic Shield Facet Overlay -->
  <path d="M 50 16 C 65 16 78 23 78 35 C 78 60 50 83 50 83 C 50 83 22 60 22 35 C 22 23 35 16 50 16 Z" 
        fill="none" stroke="url(#holoOverlay)" stroke-width="2.5" />

  <!-- Natural Leaf Silhouette Interwoven -->
  <path d="M 50 26 C 36 34 32 54 44 68 C 47 71 52 74 54 74 C 55 74 53 66 53 60 C 53 45 64 34 50 26 Z" 
        fill="url(#leafGrad)" />

  <!-- Leaf Vein & Pure Line Accent -->
  <path d="M 46 64 C 47 52 52 42 62 36" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.85" />
  
  <!-- Central Verification Sparkle / Diamond -->
  <circle cx="50" cy="46" r="3.5" fill="#FFFFFF" opacity="0.9" />
  <path d="M 66 28 L 68 33 L 73 35 L 68 37 L 66 42 L 64 37 L 59 35 L 64 33 Z" fill="#FFFFFF" opacity="0.9" />
</svg>
